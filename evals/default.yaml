suite: default
description: "Baseline recall suite — covers profile facts, system constants, and dev context"

cases:
  - id: embedding-model
    query: "which text embedding model is configured"
    expected: "text-embedding-3-small"
    k: 8
    depth: fast
    tags: [system, embeddings]

  - id: embedding-dim
    query: "embedding vector dimensions"
    expected: "1536"
    k: 8
    depth: fast
    tags: [system, embeddings]

  - id: vector-db
    query: "what is used for vector search storage"
    expected: "sqlite-vec"
    k: 8
    depth: fast
    tags: [system, storage]

  - id: rrf-k
    query: "reciprocal rank fusion k constant value"
    expected: "60"
    k: 8
    depth: fast
    tags: [system, recall]

  - id: bm25-engine
    query: "what powers BM25 keyword search"
    expected: "FTS5"
    k: 8
    depth: fast
    tags: [system, recall]

  - id: mcp-tool-recall
    query: "MCP tool name for querying memory"
    expected: "memory_recall"
    k: 8
    depth: fast
    tags: [mcp, api]

  - id: mcp-tool-remember
    query: "MCP tool name for saving a memory turn"
    expected: "memory_remember"
    k: 8
    depth: fast
    tags: [mcp, api]

  - id: llm-provider
    query: "which LLM model is used for dream cycle consolidation"
    expected: "gpt-4o-mini"
    k: 8
    depth: fast
    tags: [system, dream]

  - id: primary-language
    query: "what language is the ai-memory backend written in"
    expected: "Python"
    k: 8
    depth: fast
    tags: [preference, language]

  - id: consolidation-pipeline
    query: "how does the memory consolidation dream pipeline work"
    expected: "consolidat"
    k: 8
    depth: deep
    tags: [system, dream]

  - id: user-location
    query: "where does Igor live"
    expected: "London"
    k: 8
    depth: fast
    tags: [profile, personal]

  - id: user-role
    query: "what is Igor's job title and company"
    expected: "Citywire"
    k: 8
    depth: fast
    tags: [profile, personal]

  - id: preferred-db
    query: "what database does Igor prefer for relational data"
    expected: "PostgreSQL"
    k: 8
    depth: fast
    tags: [preference, technical]

  - id: frontend-framework
    query: "which frontend framework does Igor use"
    expected: "Angular"
    k: 8
    depth: fast
    tags: [preference, technical]

  - id: murphy-bed
    query: "tell me about Igor's Murphy bed project"
    expected: "Murphy"
    k: 8
    depth: fast
    tags: [project, personal]

  - id: communication-style
    query: "how does Igor prefer to receive answers"
    expected: "direct"
    k: 8
    depth: fast
    tags: [preference]

  - id: search-fusion
    query: "how are vector and keyword search results combined"
    expected: "Reciprocal Rank Fusion"
    k: 8
    depth: fast
    tags: [system, recall]

  # --- Profile / identity (dedup regression) -------------------------------
  # These also act as dedup regression tests: the canonical (fuller) version
  # of each fact should be returned, not a stale subset note.

  - id: user-full-name
    query: "what is Igor's full name including surname"
    expected: "Valjevic"
    k: 5
    depth: fast
    tags: [profile, personal, dedup-regression]

  - id: user-origin
    query: "where is Igor originally from, what country was he born in"
    expected: "Belgrade"
    k: 5
    depth: fast
    tags: [profile, personal, dedup-regression]

  - id: user-role-seniority
    query: "what is Igor's full job title and seniority level"
    expected: "Architect"
    k: 5
    depth: fast
    tags: [profile, personal, dedup-regression]

  - id: profile-company
    query: "what company does Igor currently work for"
    expected: "Citywire"
    k: 5
    depth: fast
    tags: [profile, promotion-quality]

  # --- Personal breadth ----------------------------------------------------

  - id: drink-preference
    query: "what does Igor prefer to drink, tea or coffee"
    expected: "tea"
    k: 5
    depth: fast
    tags: [personal]

  - id: sport-tennis
    query: "what sport does Igor play most regularly"
    expected: "tennis"
    k: 5
    depth: fast
    tags: [personal]

  - id: language-learning
    query: "what language is Igor currently learning"
    expected: "Italian"
    k: 5
    depth: fast
    tags: [personal]

  # --- Technical breadth ---------------------------------------------------

  - id: backend-language
    query: "what is Igor's primary backend programming language"
    expected: ".NET"
    k: 5
    depth: fast
    tags: [preference, technical]

  - id: dev-environment
    query: "what operating system and shell environment does Igor use for development"
    expected: "WSL"
    k: 5
    depth: fast
    tags: [technical]

  - id: ui-framework-blazor
    query: "what UI framework does Igor prefer for building web apps"
    expected: "Blazor"
    k: 5
    depth: fast
    tags: [preference, technical]
